# .github/workflows/ci.yml — fixes part of issue #15
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: core-api
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:secret@localhost:5432/testdb
      SESSION_SECRET: ci-test-session-secret-at-least-32-chars-long-ok
      NID_ENCRYPTION_KEY: ci-test-nid-encryption-key-32-chars-min-ok!
      PAYMENT_MODE: mock
      REDIS_HOST: localhost
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      API_PUBLIC_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core-api/package-lock.json

      - run: npm ci
        working-directory: core-api

      - run: npx prisma db push --skip-generate
        working-directory: core-api

      - name: Type check
        run: npm run typecheck
        working-directory: core-api

      - name: Test
        run: npm test
        working-directory: core-api

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Svelte check
        run: npx svelte-check --fail-on-warnings
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_API_BASE_URL: http://localhost:3001